    { question: "Two additional rate cuts are already ___ the current bond price, so there may be limited upside from here.", choices: ["factored out of", "baked into", "papered over", "socialized with"], answerIndex: 1, explanation: "\"Baked into\" means built in so firmly it cannot be separated out — the standard way to say the market has already absorbed an expectation. \"Factor in\" would imply it is still adjustable." },
    { question: "Which expression describes something that is merely the minimum needed to compete, offering no advantage on its own?", choices: ["a non-starter", "table stakes", "a hard stop", "a sanity check"], answerIndex: 1, explanation: "\"Table stakes\" are the minimum requirements just to be in the game. A \"non-starter\" is a proposal with no chance of succeeding at all — a different idea entirely." },
    { question: "The client canceled the review, so you're ___ for the weekend deliverable after all.", choices: ["on the hook", "off the hook", "in the loop", "up against it"], answerIndex: 1, explanation: "\"Off the hook\" means released from an obligation. \"On the hook\" would mean you are still stuck with the responsibility, which contradicts \"canceled.\"" },
    { question: "Once the internal emails leaked, the CEO's position became ___ and he resigned within the week.", choices: ["thorny", "cagey", "untenable", "buttoned-up"], answerIndex: 2, explanation: "\"Untenable\" describes a position that can no longer be defended or maintained. In press coverage this word often signals that a resignation is imminent." },
    { question: "The emergency loan does nothing about the underlying insolvency; it just ___.", choices: ["papers over the cracks", "has its work cut out", "is the tail wagging the dog", "loops them in"], answerIndex: 0, explanation: "To \"paper over the cracks\" is to hide a fundamental problem with a superficial fix. \"The tail wagging the dog\" would describe a minor element controlling a more important one." },
    { question: "Management was noticeably ___ about the buyback timing, giving long answers that never actually addressed the question.", choices: ["buttoned-up", "cagey", "tight-lipped", "untenable"], answerIndex: 1, explanation: "\"Cagey\" means deliberately vague and guarded while still speaking. \"Tight-lipped\" would mean saying nothing at all, which contradicts \"long answers.\"" }
  ]
}
];

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const TYPE_LABEL = { word:'単語', idiom:'イディオム', phrase:'フレーズ' };

function card(term, meaningEn, meaningJa, exs, explJa, syns){
  return '<div class="vcard">' +
    '<div class="vc-term">'+esc(term)+'</div>' +
    (meaningEn?'<div class="vc-mean-en">Definition: '+esc(meaningEn)+'</div>':'') +
    '<div class="vc-ex">' + (exs||[]).map(function(e){ return '<p>"'+esc(e)+'"</p>'; }).join('') + '</div>' +
    ((syns&&syns.length)?'<div class="vc-syn">'+syns.map(function(s){ return '<div class="syn-row"><b>'+esc(s.term)+'</b> — '+esc(s.nuance_ja)+'</div>'; }).join('')+'</div>':'') +
    '<div class="vc-mean-ja">'+esc(meaningJa)+'</div>' +
    '<div class="vc-expl"><p>'+esc(explJa)+'</p></div>' +
    '</div>';
}

function renderPanel(r){
  return '<div class="meta-bar"><div class="meta-date">'+esc(r.dateLabel)+'</div></div>' +
    '<div class="section"><div class="sec-title">コア表現</div><div class="card-grid">' +
      r.coreItems.map(function(it){ return card(it.term+(it.ipa?' '+it.ipa:''), it.meaning_en, it.meaning_ja, it.examples, it.explanation_ja, it.synonyms); }).join('') + '</div></div>' +
    '<div class="section"><div class="sec-title">ネイティブ形容詞</div><div class="card-grid">' +
      r.adjectives.map(function(it){ return card(it.term+(it.ipa?' '+it.ipa:''), it.meaning_en, it.meaning_ja, it.examples, it.explanation_ja, it.synonyms); }).join('') + '</div></div>' +
    '<div class="section"><div class="sec-title">実務コロケーション</div><div class="card-grid">' +
      r.collocations.map(function(it){ return card(it.phrase, it.meaning_en, it.meaning_ja, it.examples, it.explanation_ja, it.synonyms); }).join('') + '</div></div>';
}

let currentIdx = ENGLISH_REPORTS.length - 1;

function renderTabs(){
  const nav = document.getElementById('tab-nav-inner');
  nav.innerHTML = ENGLISH_REPORTS.map(function(r, i){
    return '<button class="tab-btn'+(i===currentIdx?' active':'')+'" onclick="selectDay('+i+')">'+r.date+'</button>';
  }).join('');
}
function selectDay(i){ currentIdx = i; renderTabs(); renderAll(); }
function renderAll(){
  const panels = document.getElementById('panels');
  if(ENGLISH_REPORTS.length === 0){
    panels.innerHTML = '<div id="empty-note">まだアーカイブデータはありません。index.html が8日分を超えると、直近7日より前のエントリーが自動的にここへ移動します。</div>';
    document.getElementById('tab-nav').style.display = 'none';
    return;
  }
  panels.innerHTML = renderPanel(ENGLISH_REPORTS[currentIdx]);
}
renderTabs();
renderAll();
</script>
