    { question: "Two additional rate cuts are already ___ the current bond price, so there may be limited upside from here.", choices: ["factored out of", "baked into", "papered over", "socialized with"], answerIndex: 1, explanation: "\"Baked into\" means built in so firmly it cannot be separated out — the standard way to say the market has already absorbed an expectation. \"Factor in\" would imply it is still adjustable." },
    { question: "Which expression describes something that is merely the minimum needed to compete, offering no advantage on its own?", choices: ["a non-starter", "table stakes", "a hard stop", "a sanity check"], answerIndex: 1, explanation: "\"Table stakes\" are the minimum requirements just to be in the game. A \"non-starter\" is a proposal with no chance of succeeding at all — a different idea entirely." },
    { question: "The client canceled the review, so you're ___ for the weekend deliverable after all.", choices: ["on the hook", "off the hook", "in the loop", "up against it"], answerIndex: 1, explanation: "\"Off the hook\" means released from an obligation. \"On the hook\" would mean you are still stuck with the responsibility, which contradicts \"canceled.\"" },
    { question: "Once the internal emails leaked, the CEO's position became ___ and he resigned within the week.", choices: ["thorny", "cagey", "untenable", "buttoned-up"], answerIndex: 2, explanation: "\"Untenable\" describes a position that can no longer be defended or maintained. In press coverage this word often signals that a resignation is imminent." },
    { question: "The emergency loan does nothing about the underlying insolvency; it just ___.", choices: ["papers over the cracks", "has its work cut out", "is the tail wagging the dog", "loops them in"], answerIndex: 0, explanation: "To \"paper over the cracks\" is to hide a fundamental problem with a superficial fix. \"The tail wagging the dog\" would describe a minor element controlling a more important one." },
    { question: "Management was noticeably ___ about the buyback timing, giving long answers that never actually addressed the question.", choices: ["buttoned-up", "cagey", "tight-lipped", "untenable"], answerIndex: 1, explanation: "\"Cagey\" means deliberately vague and guarded while still speaking. \"Tight-lipped\" would mean saying nothing at all, which contradicts \"long answers.\"" }
  ]

  collocations: [

      explanation_ja: "米軍で新編部隊を実戦可能な状態にすることを stand up a unit と言ったのが起源で、そこからコンサルティングと事業会社の現場に広がった。set up との違いは「実際に機能し始めるところまで」を含意する点で、箱だけ作って動いていない状態には使いにくい。対義語は stand down（部隊を解散する、活動を停止する）で、\"we stood the task force down after close\" のように使える。ディールの統合作業、規制対応の体制構築、新規事業の立ち上げを語る場面で、set up より一段プロらしく響く。"

  todayQuiz: [
    { question: "The fund cut its equity exposure on the tariff headline, then bought back a week later just before the second selloff — it was ___ twice in ten days.", choices: ["whipsawed", "gold-plated", "dovetailed", "penciled in"], answerIndex: 0, explanation: "\"Whipsaw\" describes losing twice because a price moved sharply one way and then reversed. The word requires two opposite movements, so a single bad call in one direction would not qualify." },
    { question: "The acquisition ___ our existing distribution almost perfectly: the same customers, the same logistics, and virtually no overlapping products.", choices: ["bristles at", "dovetails with", "pours cold water on", "stands up"], answerIndex: 1, explanation: "\"Dovetail with\" comes from a joinery technique and claims that two things fit together so precisely that they function as one. It asserts structural fit, not merely general agreement of direction." },
    { question: "The CFO ___ at the word \"aggressive\" — it was the only moment all afternoon when he interrupted anyone.", choices: ["bristled", "grandstanded", "dovetailed", "penciled"], answerIndex: 0, explanation: "To \"bristle at\" something is to show a flash of visible irritation, taken from an animal raising its hackles. It describes the observable reaction rather than the internal feeling, which is why it suits a written account of a meeting." },
    { question: "The hearing produced no new facts — three hours of ___ for the cameras.", choices: ["grandstanding", "gold-plating", "talking past each other", "standing up"], answerIndex: 0, explanation: "\"Grandstanding\" is performing for an audience instead of addressing the problem, and it requires that an audience exist, which a televised hearing supplies. \"Talking past each other\" would mean the participants failed to engage with one another's arguments, which is a different failure." },
    { question: "Management ___ the buyback question before the analyst had even finished asking it.", choices: ["poured cold water on", "fired a shot across the bow of", "was not wedded to", "stood up"], answerIndex: 0, explanation: "\"Pour cold water on something\" means to deliberately reduce enthusiasm for an idea or expectation, and it takes the hot topic as its object rather than a person. A shot across the bow would be a warning to a rival, not a response to a question." },
    { question: "Cutting price in two small test markets was ___: no real damage done, but a clear signal that they could fund a national price war if we pushed them.", choices: ["a shot across the bow", "a haircut", "an arm's-length transaction", "a wonky detail"], answerIndex: 0, explanation: "\"A shot across the bow\" is a warning that deliberately stops short of causing harm, from the naval practice of firing ahead of a ship rather than at it. Once real damage is done, the phrase no longer applies." },
    { question: "I wasn't on either deal team, so ___ — read what follows as a genuinely outside view.", choices: ["I don't have a dog in this fight", "I'm not wedded to it", "I could go either way", "we're talking past each other"], answerIndex: 0, explanation: "\"I don't have a dog in this fight\" says you have no stake in the outcome, which is offered as a guarantee of impartiality. \"I could go either way\" would be a claim about the balance of the arguments, not about your own interest." },
    { question: "The lease is with an entity the founder's family controls, so the rent has to be set ___ or the auditors will have questions.", choices: ["at arm's length", "at a haircut", "in pencil", "under fire"], answerIndex: 0, explanation: "\"At arm's length\" means on the terms a genuinely independent party would have agreed to. It is the standard test applied to related-party dealings precisely because the parties involved are not independent." },
    { question: "I used twelve percent because it matched the peer set, but ___ — bring me a better anchor and I'll change it.", choices: ["I'm not wedded to it", "I don't have a dog in this fight", "for my money", "it cuts both ways"], answerIndex: 0, explanation: "\"I'm not wedded to it\" signals that you had a reason for a proposal but will give it up for a better one. It separates the idea from the person who made it, which makes disagreement easier for everyone else in the room." },
    { question: "The ___ lender has lost three CFOs in eighteen months and now trades at a third of book value.", choices: ["beleaguered", "dogged", "wonky", "janky"], answerIndex: 0, explanation: "\"Beleaguered\" means besieged from several directions and struggling under sustained pressure; it is standard news-English placed immediately before the noun. \"Dogged\" is complimentary and describes stubborn persistence, not distress." },
    { question: "Two years of ___ follow-up with the sellers' advisers finally got us into the data room.", choices: ["dogged", "beleaguered", "janky", "arm's-length"], answerIndex: 0, explanation: "\"Dogged\" praises persistence that continues long after most people would have stopped. Note the pronunciation: as an adjective it has two syllables, /ˈdɔːɡɪd/, unlike the one-syllable past tense of the verb." },

    { question: "Her single question about deferred revenue exposed the whole problem in one line — a genuinely ___ point.", choices: ["incisive", "glib", "pedestrian", "portentous"], answerIndex: 0, explanation: "\"Incisive\" praises thinking that cuts straight through to the essential issue, from the Latin for cutting into. It is a compliment, whereas each of the other options carries criticism." },
    { question: "Strip out the one-off asset sale and the underlying growth looks fairly ___ — respectable, but there is nothing here anyone will remember.", choices: ["pedestrian", "spotty", "glib", "incisive"], answerIndex: 0, explanation: "\"Pedestrian\" means dull and unremarkable, from the image of walking on the ground rather than flying. \"Spotty\" would claim the results were inconsistent, but the sentence describes performance that is uniformly ordinary." },
    { question: "Bringing the pension deficit into a discussion that was only ever about working capital just ___.", choices: ["muddies the waters", "obviates the need", "commands a premium", "makes headway"], answerIndex: 0, explanation: "\"Muddy the waters\" means to make an issue harder to resolve by introducing side issues, and it works whether the confusion was deliberate or accidental. \"Obfuscate\" would insist the speaker intended to confuse." },

    { question: "The sponsor agreed to ___ the rights issue, so the company receives the full amount even if shareholders do not subscribe.", choices: ["backstop", "tee up", "drum up", "carry weight for"], answerIndex: 0, explanation: "A backstop is support arranged in advance that takes effect only if the primary route fails, which is exactly what an underwritten rights issue provides. The other options describe preparing, generating interest, or having influence." },

    { question: "The credit is strong and the deposit base is sticky; the only ___ is an unfunded pension liability.", choices: ["fly in the ointment", "wrench in the works", "rubber stamp", "backstop"], answerIndex: 0, explanation: "\"A fly in the ointment\" requires the surrounding situation to be genuinely good and names the single flaw that spoils it. \"Throw a wrench in the works\" describes disrupting a plan in motion, not a defect in something otherwise attractive." },

  todayQuiz: [
    { question: "The committee ___ to its original underwriting criteria even when the pipeline dried up, and that discipline is why the book still performs.", choices: ["hewed", "waffled", "sunset", "eviscerated"], answerIndex: 0, explanation: "\"Hew to\" means staying deliberately aligned with a standard despite pressure to drift, which is exactly what the sentence praises. \"Adhere to\" would state the same compliance without conveying that the alignment was tested." },
    { question: "The final rule keeps the disclosure requirement on paper but ___ it by exempting almost every firm it was written for.", choices: ["eviscerates", "sunsets", "hews to", "clears the decks for"], answerIndex: 0, explanation: "\"Eviscerate\" means stripping out the substance so that only an empty shell remains, which fits a rule that survives in form but not in effect. \"Water down\" would suggest the requirement was weakened rather than hollowed out." },
    { question: "We ___ on the bid for six weeks, and by the time we got comfortable the seller had signed with someone else.", choices: ["waffled", "hewed", "threaded", "sunset"], answerIndex: 0, explanation: "\"Waffle\" describes drifting between positions because you will not commit, and it takes \"on\" before the subject of the indecision. \"Hedge\" would imply a deliberate strategy of avoiding commitment rather than an inability to decide." },
    { question: "\"We haven't seen the audited accounts yet, so I don't want to ___.\" Which completion is idiomatic?", choices: ["get out over my skis", "put a pin in it", "clear the decks", "split the difference"], answerIndex: 0, explanation: "\"Get out over your skis\" means going further than your evidence supports, so it is the natural hedge before sharing an unverified view. \"Jump the gun\" would point only at bad timing rather than at missing support." },
    { question: "A good question arises that would take twenty minutes and is worth the whole group's attention, but not today. You say:", choices: ["Let's put a pin in it.", "Let's split the difference.", "Let's clear the decks.", "Fish or cut bait."], answerIndex: 0, explanation: "\"Put a pin in it\" sets a topic aside with an explicit promise to return to it, which protects the question while keeping the meeting on time. \"Shelve it\" would suggest the topic may never come back." },
    { question: "Seed funds ___ because two outcomes carry the entire portfolio; a credit mandate cannot think that way.", choices: ["swing for the fences", "thread the needle", "clear the decks", "hew to the plan"], answerIndex: 0, explanation: "\"Swing for the fences\" describes pursuing the largest possible outcome while accepting a high failure rate, which is the logic of early-stage investing. \"Roll the dice\" would make the outcome pure chance rather than a deliberate strategy." },
    { question: "We have extended exclusivity twice with no answer. At some point the buyer has to ___.", choices: ["fish or cut bait", "put a pin in it", "thread the needle", "say more about that"], answerIndex: 0, explanation: "\"Fish or cut bait\" demands that someone either commit or step aside, and its force comes from the cost their indecision imposes on everyone else. \"Make up your mind\" would carry none of that pressure about wasted time." },
    { question: "Which question best converts an argument about whether people like a plan into something testable?", choices: ["What would have to be true for the fifteen percent margin to hold in year three?", "How confident are you in the margin?", "What's the bull case for the margin?", "What's the ask here?"], answerIndex: 0, explanation: "\"What would have to be true for ~?\" reframes a matter of opinion as a set of conditions that can be checked, and each condition becomes a work item. Asking about confidence only surfaces subjective belief, which is what the debate was already stuck on." },
    { question: "Everyone in the room likes the asset. Which opening makes disagreement a contribution rather than an attack?", choices: ["I'll take the other side of that.", "I disagree.", "I'm not sure I buy that.", "Say more about that."], answerIndex: 0, explanation: "\"I'll take the other side of that\" borrows from trading and frames dissent as a role you are taking on, which depersonalises it and commits you to building the counter-case. \"I disagree\" states a personal conclusion and invites the discussion to become adversarial." },
    { question: "The committee reads only the opening line and skims the rest, so the summary has to be ___.", choices: ["pithy", "exacting", "byzantine", "beholden"], answerIndex: 0, explanation: "\"Pithy\" praises writing that is short yet carries genuine substance, which is what an opening line for skim readers must do. \"Terse\" would suggest brevity that comes across as curt or unhelpful." },
    { question: "Nine entities across four jurisdictions, and nobody can say who has signing authority. The structure is ___.", choices: ["byzantine", "pithy", "exacting", "beholden"], answerIndex: 0, explanation: "\"Byzantine\" describes intricacy so layered that it looks designed to obscure, which fits a deliberately complicated holding structure. \"Opaque\" would say only that you cannot see inside, not that the design itself is a maze." },
    { question: "Half the board was appointed by the founder, so nobody should be surprised that the committee is ___ him.", choices: ["beholden to", "exacting with", "pithy about", "hewing at"], answerIndex: 0, explanation: "\"Beholden to\" means owing someone so much that your independence is compromised, which is the standard governance criticism here. \"Indebted\" would describe the obligation without the loss of independence that is the whole point." },
    { question: "The pricing has to ___ between keeping the anchor client and not resetting the entire book lower.", choices: ["thread the needle", "move the needle", "split the difference", "clear the decks"], answerIndex: 0, explanation: "\"Thread the needle\" means finding the narrow path that satisfies conflicting requirements at once, and it takes \"between A and B.\" \"Move the needle\" is an unrelated idiom about producing a measurable change in a headline number." },
    { question: "Nothing else gets calendar time until the filing goes in. The instruction to the team is to ___.", choices: ["clear the decks", "put a pin in it", "swing for the fences", "split the difference"], answerIndex: 0, explanation: "\"Clear the decks\" comes from readying a warship for battle and means stripping away lesser work to concentrate on one imminent effort. \"Prioritise\" would describe ranking the work without actually removing anything from the schedule." }
  ]

  todayQuiz: [
    { question: "The finance team's month-end close still relies on a ___ where an intern manually re-keys numbers from one system into another that was never built to receive them.", choices: ["kludge", "audit trail", "sandbox", "backlog"], answerIndex: 0, explanation: "A kludge is an inelegant, jury-rigged fix that technically works but was never designed properly, like re-keying numbers by hand. An audit trail is a record of transactions, a sandbox is an isolated test environment, and a backlog is accumulated unfinished work — all plausible in finance operations, but none names the clumsy patch itself." },
    { question: "The board passed over the brilliant but junior candidate, saying he lacked the ___ to face down activist investors in a live negotiation.", choices: ["levity", "gravitas", "leverage", "bandwidth"], answerIndex: 1, explanation: "Gravitas is the weighty, serious presence that makes people take you seriously in high-stakes moments. Levity is lightness or humor (roughly the opposite), leverage is bargaining power, and bandwidth is capacity for work — none is the personal quality needed to face down activist investors." },
    { question: "Rather than push the founder into one of their standard hedging products, the private bank built a fully ___ structure around his specific concentrated stock position.", choices: ["plain-vanilla", "bootstrapped", "boilerplate", "bespoke"], answerIndex: 3, explanation: "Bespoke means made specifically for one client, the polished private-banking term. Plain-vanilla is the finance word for basic standard instruments (the standard hedging products the bank avoided), boilerplate is reusable standard text, and bootstrapped means funded without outside capital." },
    { question: "After the team worked through the weekend to save the launch, it would be ___ not to at least send a thank-you note, even if the final product still has bugs.", choices: ["obsequious", "punctilious", "churlish", "tenacious"], answerIndex: 2, explanation: "It would be churlish not to… is the set phrase for criticizing an ungracious failure to show due thanks. Obsequious means fawning, punctilious means fussy about rules and details, and tenacious means stubbornly persistent — none of them fit a failure to say thank you." },
    { question: "Before joining the hedge fund, she ___ doing credit analysis at a small regional bank, which is where she learned to read a balance sheet cold.", choices: ["jumped the gun", "cut her teeth", "rocked the boat", "cut corners"], answerIndex: 1, explanation: "Cut your teeth means to gain your first foundational experience. Jump the gun is to act too early, rock the boat is to disturb a stable situation, and cut corners is to skip steps to save effort — none explains where she learned her skills." },
    { question: "The auditor couldn't point to a specific error yet, but three quarters of suspiciously identical gross margins to the decimal point made her ___.", choices: ["smell a rat", "blow the whistle", "see red", "rest easy"], answerIndex: 0, explanation: "Smell a rat is to sense that something dishonest is going on from circumstantial clues. Blowing the whistle means formally reporting wrongdoing (she has no proof yet), see red means to become furious, and rest easy is the opposite of suspicion." },
    { question: "Every week he emails HR about a new minor grievance — the thermostat, the parking assignment, the font on the internal wiki — earning him a reputation as the office's most ___ complainer.", choices: ["laconic", "fastidious", "querulous", "garrulous"], answerIndex: 2, explanation: "Querulous describes a habitual, whining tendency to complain about small grievances. Garrulous means overly talkative, laconic means using very few words, and fastidious means extremely picky about quality or cleanliness — a fussy person is not necessarily a complainer." },
    { question: "His lecture on the importance of protecting personal time rang especially ___ given that he had sent the team eleven emails between midnight and 3 a.m. the night before.", choices: ["querulous", "ebullient", "deferential", "sanctimonious"], answerIndex: 3, explanation: "Sanctimonious means making a show of moral superiority — and the midnight emails add the hypocrisy. Querulous is habitually complaining, ebullient is bubbly and enthusiastic, and deferential is respectfully yielding to others." },
    { question: "Even as the portfolio dropped another eight percent in a single session, the fund ___ and didn't sell a single position.", choices: ["got cold feet", "held its nerve", "jumped ship", "threw in the towel"], answerIndex: 1, explanation: "Hold your nerve is the trading idiom for resisting the urge to panic-sell under pressure. Get cold feet means losing courage at the last moment, jump ship means abandoning a venture, and throw in the towel means admitting defeat — all describe backing out." }
  ]

  todayQuiz: [
    { question: "The board signed off on the acquisition, with one ___: the earn-out calculation still needs to be re-run once Q4 numbers close.", choices: ["caveat", "impasse", "underpinning", "quid pro quo"], answerIndex: 0, explanation: "A caveat is a specific condition or warning attached to an otherwise settled agreement. An impasse is a deadlock, an underpinning is a foundation, and a quid pro quo is an exchange of favors — none is a single outstanding condition on an approved deal." },
    { question: "The whole retention thesis in this deck is ___ by a single assumption about renewal rates that nobody on the deal team has actually pressure-tested.", choices: ["corroborated", "surfaced", "cherry-picked", "underpinned"], answerIndex: 3, explanation: "Underpin means to form the foundation a conclusion rests on. Corroborated means confirmed by independent evidence (not by an untested assumption), surfaced means brought a hidden issue to light, and cherry-picked means selected only favorable examples." },
    { question: "Given how sensitive the restructuring talks are, legal has told everyone to stay ___ in any written communication until the announcement is final.", choices: ["candid", "circumspect", "sanguine", "flippant"], answerIndex: 1, explanation: "Circumspect means deliberately careful about what you say given the risks. Candid (openly frank) and flippant (casually disrespectful) are the opposite of what legal wants, and sanguine means cheerfully optimistic, which says nothing about caution." },
    { question: "Everyone else praised the pitch politely, but her ___ remark — 'cute deck, shame about the unit economics' — was the line people actually quoted afterward.", choices: ["effusive", "sanguine", "acerbic", "flippant"], answerIndex: 2, explanation: "Acerbic describes a sharp, cutting, witty remark, which is why \"cute deck, shame about the unit economics\" got quoted. Effusive means gushing, sanguine means optimistic, and flippant means casually unserious rather than pointed." },
    { question: "Once he admitted by email that he'd known about the defect before closing, he didn't ___ in the indemnification dispute.", choices: ["have a leg to stand on", "have a change of heart", "have a hidden agenda", "have deep pockets"], answerIndex: 0, explanation: "Not have a leg to stand on means having no valid justification left — exactly what his written admission caused. A change of heart is a reversal of opinion, a hidden agenda is a secret motive, and deep pockets means plenty of money." },
    { question: "Ever since one associate started turning in flawless first drafts, the rest of the team has felt real pressure to keep up — she's basically ___ for the whole group.", choices: ["moved the goalposts", "set a precedent", "passed the buck", "raised the bar"], answerIndex: 3, explanation: "Raise the bar means increasing the standard everyone else must meet. Move the goalposts changes the rules unfairly after the fact, set a precedent creates a model for future cases, and pass the buck shifts responsibility to someone else." },
    { question: "After the first office closure was announced, employees at the other two locations have just been ___, assuming theirs is next.", choices: ["burying their heads in the sand", "waiting for the other shoe to drop", "weathering the storm", "getting ahead of themselves"], answerIndex: 1, explanation: "Wait for the other shoe to drop is anticipating a second piece of bad news after the first. Burying your head in the sand is ignoring a problem, weathering the storm is enduring hardship, and getting ahead of yourself is assuming too much too soon." },
    { question: "Getting reimbursed by that insurer meant three phone calls, two notarized forms, and a fax — literally having to ___ for a claim that should have been automatic.", choices: ["jump through hoops", "cut through the red tape", "go the extra mile", "read the fine print"], answerIndex: 0, explanation: "Jump through hoops is being forced through many tedious steps for something simple. Cutting through red tape is the opposite (removing bureaucracy), going the extra mile is voluntary, and reading the fine print is checking the small details of a contract." },
    { question: "Even clients used to paying a premium for expertise raised eyebrows at the consultancy's ___ day rate.", choices: ["exuberant", "expedient", "exorbitant", "exemplary"], answerIndex: 2, explanation: "Exorbitant describes a price that is unreasonably high. Exuberant means joyfully energetic, expedient means convenient rather than principled, and exemplary means worthy of being a model — none describe a fee." },
    { question: "Facing a revenue shortfall, the company announced a surprisingly ___ budget for next year, cutting travel, offsites, and nearly all discretionary spend.", choices: ["profligate", "austere", "ascetic", "exorbitant"], answerIndex: 1, explanation: "Austere describes a strict, stripped-down policy or budget with no luxuries. Ascetic is similar but describes a person's self-denying lifestyle, profligate means recklessly wasteful, and exorbitant means excessively expensive." },
    { question: "The case study only features the three clients who saw huge ROI and says nothing about the dozen who churned — a clear case of ___ the data.", choices: ["cherry-picking", "whitewashing", "benchmarking", "stress-testing"], answerIndex: 0, explanation: "Cherry-picking means presenting only the favorable examples and leaving out the contradicting ones. Whitewashing covers up wrongdoing with a glossy surface, benchmarking compares against peers, and stress-testing checks how something holds up under pressure." },
    { question: "Their opening offer on the house was almost insulting, but our agent said it was just a classic ___ meant to test how motivated we were to sell.", choices: ["counteroffer", "sweetened offer", "lowball offer", "lump-sum offer"], answerIndex: 2, explanation: "A lowball offer is an intentionally low opening bid used as a negotiating tactic. A counteroffer is a reply to an earlier offer, a sweetened offer is one improved to make it more attractive, and a lump-sum offer describes a payment structure, not its size." }
  ]

      text: "Subject: Following up on the Meridian earn-out\n\nHi Daniel,\n\nQuick note before the 3pm call — let's keep this {{germane|germane}} to the earn-out dispute rather than reopening the whole agreement. The {{upshot|upshot}} of yesterday's session is that their counsel still won't confirm who actually {{calls the shots|call the shots}} on their side; every proposal gets kicked upstairs and comes back diluted.\n\nIf you talk to them first, just {{give me the headline|give me the headline}} afterward — I don't need the play-by-play. My read is that we'll eventually have to {{bite the bullet|bite the bullet}} and offer a modest cash top-up to {{sweeten the deal|sweeten the deal}}, because their argument that the KPI definition was ambiguous simply doesn't {{hold water|hold water}} once you reread Schedule 4.2.\n\nYou and I are {{cut from the same cloth|cut from the same cloth}} on this: neither of us wants to drag it into Q4. Once legal signs off, finance can {{cut a check|cut a check}} within 48 hours, and we can finally {{put a bow on it|put a bow on it}} before the holidays.\n\nTalk soon,\nPriya",

      text: "Attendees flagged that Solera Capital has become a {{voracious|voracious}} acquirer in our space, closing three bolt-ons since June, and its new fund is giving our platform {{a real run for its money|give someone a run for their money}} on pricing. Marcus raised a more {{insidious|insidious}} risk: our two top reps have gone quiet on renewal calls, and we agreed someone should quietly {{run the traps|run the traps}} with HR before the board update.\n\nOn strategy, Elena's expansion plan is still {{quixotic|quixotic}} — ambitious and admirable, but about a year ahead of the balance sheet. We asked her to {{put some meat on the bones|put some meat on the bones}} before January: real headcount, real timeline. Two culture notes surfaced too: engineering has grown {{insular|insular}}, resisting input from the new product hires, and several people find the new VP {{unctuous|unctuous}} toward leadership but dismissive otherwise.\n\nNobody wants the vendor renewal to turn into another {{vexed|vexed}} negotiation like last year's three-month standoff, and procurement should not let the vendor {{pull the rug out from under them|pull the rug out from under (someone)}} again by changing terms at the last minute.",
      translation_ja: "会議メモ — 競合レビュー（木曜）\n\n出席者から、Solera Capitalが当業界で貪欲な買収者になっているとの指摘がありました。6月以降すでに3件の小型買収を完了しており、新しいミッドマーケットファンドは価格面で我々のプラットフォームに苦戦させるほどの好勝負を仕掛けてきています。マーカスはより厄介なリスクを提起しました。トップ営業2名が更新の電話で口数が減っており、取締役会の報告前に静かにHRと確認すべきだと合意しました。\n\n戦略面では、エレナの拡張計画は依然として現実離れした理想主義のままです — 志は立派ですが、財務状況より1年ほど先を行っています。1月までに具体的な人員計画と時間軸で肉付けするよう依頼しました。組織文化についても2点浮上しました。エンジニアリングチームは閉鎖的になっており新しいプロダクト採用者の意見を受け入れず、新任VPは上には愛想がいいのに他には冷淡だと感じている人が複数いました。\n\nベンダー更新契約が、去年のような3か月も長引く厄介な交渉に戻るのは避けたいところです。調達チームが直前になって条件を変えられ、土壇場ではしごを外されるようなことが二度とないようにすべきです。"

      text: "MARKET BRIEF — Caldwell Foods rejects revised bid\n\nCaldwell Foods' board rejected a sweetened offer from Harrow Industrial on Tuesday, calling the buyer's timeline argument \"{{specious|specious}}\" and warning that only a {{cursory|cursory}} review of the synergy assumptions would have caught the gap. Caldwell has remained {{intransigent|intransigent}} on price since talks began in July, and people close to the company say management wants to {{keep Harrow at arm's length|keep someone at arm's length}} until a formal process is announced.\n\nThe company's founder, famously {{unassuming|unassuming}} for someone who built a nine-figure business from a single Ohio plant, issued a short statement blaming Harrow's \"{{brash|brash}}\" negotiating style for the breakdown. Analysts are split: Caldwell's stock has been {{lackluster|lackluster}} for two straight quarters, and some argue management is too {{entrenched|entrenched}} in the founding family to consider a fair deal at any price.\n\nHarrow's own guidance was notably {{understated|understated}}, hinting only that it \"continues to evaluate its options\" — market watchers expect the buyer to {{pull the trigger|pull the trigger}} on a hostile tender offer within weeks if talks stay frozen.",
      translation_ja: "市場速報 — Caldwell Foods、修正オファーを拒否\n\nCaldwell Foodsの取締役会は火曜日、Harrow Industrialからの条件引き上げ後のオファーを拒否し、買い手のタイムライン主張を「見かけ倒し」と評した。合成効果の前提をざっと確認しただけでもこのギャップには気づけたはずだと警告している。Caldwellは7月の協議開始以来、価格について一切譲らない姿勢を貫いており、正式なプロセスが発表されるまでHarrowとは距離を置くつもりだと関係者は語る。\n\n同社の創業者は、オハイオ州の一工場から9桁規模の事業を築いた人物にしては珍しく控えめな性格で知られるが、今回は短い声明でHarrowの「高慢な」交渉姿勢が決裂の原因だと非難した。アナリストの反応は割れている。Caldwellの株価は2四半期連続で精彩を欠いており、経営陣が創業家に固執しすぎてどんな価格でも公正な取引を検討できないでいるとの見方もある。\n\nHarrowの発表は控えめなトーンにとどまり、「引き続き選択肢を検討している」とだけ示唆した。交渉が凍りついたままなら、数週間以内に買い手が敵対的TOBに踏み切るだろうと市場は見ている。"

      translation_ja: "社内メモ — 経費規定の更新について\n\n来月の新しい出張規定の展開の前に、一度立ち止まって、昨年の展開がうまくいかなかったことを認めておきたいと思います。添付の概要を早めに確認のうえ、金曜までにコメントを送ってください。\n\nワーキンググループからいくつか補足します。経理チームは昨年のメール対応で、率直に言えば言葉が厳しすぎました。今回はそうならないようにします。また、あるディレクターが承認システムを飛ばして役職を盾に例外を通そうとしたケースがありました。今後は役職に関係なく例外は一切認めません。75ドルを超える支出については、これまで通り領収書添付を厳格に守ってください。この規定は変わりません。\n\n10月1日より前に承認済みの予約は旧規定のまま適用対象として引き継がれるので、現在出張中の人が何かを再提出する必要はありません。レビューの場では、反発するより歩み寄る姿勢でお願いします。全体会議での大声の反発が、書面でのコメントほど議論を動かすことはめったにありません。また、条文が本当に分かりにくいと感じたら、具体的にどの一文か教えてください。「もっと簡潔に」というだけのフィードバックでは対応できません。\n\nご協力に感謝します。"

      title: "The Thursday I Wrote the Letter",
      genre: "Personal Essay",
      text: "Let me {{set the record straight|set the record straight}}: I didn't quit because of one bad quarter. I'd been {{dragging my feet|drag your feet}} on the decision for almost two years, half-hoping the role would change shape on its own if I just waited long enough.\n\nLooking back, I think I let my own habits {{ossify|ossify}} — the same commute, the same Tuesday meeting, the same three sentences I used to {{obfuscate|obfuscate}} how bored I actually was whenever someone asked how work was going. I'd {{vacillate|vacillate}} between drafting a resignation letter on a Sunday night and deleting it by Monday morning, over and over, for months.\n\nTo {{bury the lede|bury the lede}} slightly less: what actually pushed me over the edge wasn't the job at all, it was watching a friend {{throw in the towel|throw in the towel}} on her own stalled career and admit, out loud, that she'd been {{keeping her doubts close to the vest|keep something close to the vest}} for a year. I didn't want to {{abscond|abscond}} the moment something better came along instead of just leaving properly, the way she wished she had.\n\nSo one Thursday I told myself, {{let's take a beat|Let's take a beat.}}, wrote the letter, and didn't delete it.",

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const TYPE_LABEL = { word:'単語', idiom:'イディオム', phrase:'フレーズ' };

function card(term, meaningEn, meaningJa, exs, explJa, syns){
  return '<div class="vcard">' +
    '<div class="vc-term">'+esc(term)+'</div>' +
    (meaningEn?'<div class="vc-mean-en">Definition: '+esc(meaningEn)+'</div>':'') +
    '<div class="vc-ex">' + (exs||[]).map(function(e){ return '<p>"'+esc(e)+'"</p>'; }).join('') + '</div>' +
    ((syns&&syns.length)?'<div class="vc-syn">'+syns.map(function(s){ return '<div class="syn-row"><b>'+esc(s.term)+'</b> — '+esc(s.nuance_ja)+'</div>'; }).join('')+'</div>':'') +
    '<div class="vc-mean-ja">'+esc(meaningJa)+'</div>' +
    '<div class="vc-expl"><p>'+esc(explJa)+'</p></div>' +
    '</div>';
}

function renderPanel(r){
  if(r.mode === 'review'){
    const ps = (r.passages||[]).map(function(p){
      return '<div class="vcard" style="margin-bottom:12px"><div class="vc-term">'+esc(p.title||'')+(p.genre?' <span style="font-size:11px;color:#6d28d9">['+esc(p.genre)+']</span>':'')+'</div>' +
        '<div class="vc-ex"><p>'+esc(String(p.text||'').replace(/\{\{([^|}]+)\|([^}]+)\}\}/g,'$1')).replace(/\n/g,'<br>')+'</p></div>' +
        (p.translation_ja?'<div class="vc-expl"><p>'+esc(p.translation_ja).replace(/\n/g,'<br>')+'</p></div>':'')+'</div>';
    }).join('');
    return '<div class="meta-bar"><div class="meta-date">'+esc(r.day ? 'Day '+r.day+'（Phase '+(r.phase||1)+' 復習・Round '+(r.round||1)+'）' : r.dateLabel+'（復習デー）')+'</div></div>' +
      (ps ? (r.scopeLabel?'<div class="vc-grammar" style="margin-bottom:10px">対象：'+esc(r.scopeLabel)+'</div>':'') + ps
          : '<div id="empty-note">この日は復習デーのため、新規の表現はありません。</div>');
  }
  return '<div class="meta-bar"><div class="meta-date">'+esc(r.dateLabel)+'</div></div>' +
    '<div class="section"><div class="sec-title">コア表現</div><div class="card-grid">' +
      r.coreItems.map(function(it){ return card(it.term+(it.ipa?' '+it.ipa:''), it.meaning_en, it.meaning_ja, it.examples, it.explanation_ja, it.synonyms); }).join('') + '</div></div>' +
    '<div class="section"><div class="sec-title">ネイティブ形容詞</div><div class="card-grid">' +
      r.adjectives.map(function(it){ return card(it.term+(it.ipa?' '+it.ipa:''), it.meaning_en, it.meaning_ja, it.examples, it.explanation_ja, it.synonyms); }).join('') + '</div></div>' +
    '<div class="section"><div class="sec-title">実務コロケーション</div><div class="card-grid">' +
      r.collocations.map(function(it){ return card(it.phrase, it.meaning_en, it.meaning_ja, it.examples, it.explanation_ja, it.synonyms); }).join('') + '</div></div>';
}

let currentIdx = ENGLISH_REPORTS.length - 1;

function renderTabs(){
  const nav = document.getElementById('tab-nav-inner');
  nav.innerHTML = ENGLISH_REPORTS.map(function(r, i){
    return '<button class="tab-btn'+(i===currentIdx?' active':'')+'" onclick="selectDay('+i+')">'+(r.day ? 'Day '+r.day : r.date)+'</button>';
  }).join('');
}
function selectDay(i){ currentIdx = i; renderTabs(); renderAll(); }
function renderAll(){
  const panels = document.getElementById('panels');
  if(ENGLISH_REPORTS.length === 0){
    panels.innerHTML = '<div id="empty-note">まだアーカイブデータはありません。index.html が8日分を超えると、直近7日より前のエントリーが自動的にここへ移動します。</div>';
    document.getElementById('tab-nav').style.display = 'none';
    return;
  }
  panels.innerHTML = renderPanel(ENGLISH_REPORTS[currentIdx]);
}
renderTabs();
renderAll();
</script>
