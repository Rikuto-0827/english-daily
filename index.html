<title>📘 Daily English Lab | 実践英語トレーニング</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Sans','Yu Gothic',Arial,sans-serif;background:#f7f5f0;color:#25211b;min-height:100vh;line-height:1.6}
a{color:#0d6e6e}

/* Header */
#site-header{background:linear-gradient(135deg,#1f2937 0%,#134e4a 60%,#0f3d3a 100%);color:#fff;padding:16px 24px;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.35)}

#site-header h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
#site-header h1 .sub{font-size:12px;font-weight:400;opacity:.62;margin-left:8px}
#stat-badge{background:rgba(45,212,191,.15);border:1px solid rgba(45,212,191,.35);color:#5eead4;font-size:11.5px;padding:5px 13px;border-radius:20px;white-space:nowrap}

/* Tab Nav */
#tab-nav{background:#fff;border-bottom:2px solid #e7e2d8;position:sticky;top:60px;z-index:100;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tab-nav::-webkit-scrollbar{display:none}
#tab-nav-inner{display:inline-flex;padding:0 20px;min-width:100%;max-width:1160px;margin:0 auto}
.tab-btn{border:none;background:none;padding:10px 18px;font-size:13px;font-weight:600;color:#7a7364;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s;white-space:nowrap}
.tab-btn:hover{color:#0f3d3a}
.tab-btn.active{color:#0f3d3a;border-bottom-color:#14b8a6}
.tab-btn .dow{display:block;font-size:10px;color:#a8a190;font-weight:400;margin-top:1px}
.tab-btn.active .dow{color:#5eead4}

/* Panel */
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 60px}
.report-panel{display:none}
.report-panel.active{display:block}
.meta-bar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.meta-date{font-size:17px;font-weight:800;color:#1f2937}
.meta-time{font-size:11.5px;background:#eef2f0;color:#0f3d3a;padding:4px 11px;border-radius:20px;font-weight:700}

.section{margin-bottom:32px}
.sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#8a8371;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:#e7e2d8}

/* Cards grid */
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:760px){.card-grid{grid-template-columns:1fr}}

.vcard{background:#fff;border-radius:14px;padding:18px 19px;box-shadow:0 1px 6px rgba(0,0,0,.06);border:1px solid #efe9dc;border-top:4px solid #94a3b8}
.vcard.tp-word{border-top-color:#4f46e5}
.vcard.tp-idiom{border-top-color:#7c3aed}
.vcard.tp-phrase{border-top-color:#0d9488}
.vcard.tp-adj{border-top-color:#d97706}
.vcard.tp-collo{border-top-color:#be123c}

.vc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.vc-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.b-word{background:#eef2ff;color:#4338ca}
.b-idiom{background:#f5f3ff;color:#6d28d9}
.b-phrase{background:#f0fdfa;color:#0f766e}
.b-adj{background:#fffbeb;color:#b45309}
.b-collo{background:#fff1f2;color:#be123c}
.vc-reg{font-size:10.5px;color:#a8a190}

.vc-term{font-size:19px;font-weight:800;color:#1f2937;letter-spacing:-.3px}
.vc-ipa{font-size:12px;color:#a8a190;font-weight:400;margin-left:7px}
.vc-mean-ja{font-size:14.5px;font-weight:700;color:#0f3d3a;margin-top:6px}
.vc-mean-en{font-size:12px;color:#7a7364;font-style:italic;margin-top:3px}

.vc-ex{margin-top:11px;padding-left:14px;border-left:3px solid #eef2f0}
.vc-ex p{font-size:12.5px;color:#4b4638;margin-bottom:5px;line-height:1.6}
.vc-ex p::before{content:'"';color:#c3bda9}
.vc-ex p::after{content:'"';color:#c3bda9}

.vc-syn{margin-top:12px;background:#faf9f5;border-radius:9px;padding:10px 12px}
.vc-syn-lbl{font-size:10px;font-weight:700;color:#a8a190;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.syn-row{font-size:12px;margin-bottom:5px;line-height:1.55}
.syn-row:last-child{margin-bottom:0}
.syn-term{font-weight:700;color:#0f3d3a}
.syn-nuance{color:#5c5647}

.vc-expl{margin-top:12px;background:linear-gradient(135deg,#fffbf0,#fff8ec);border:1px solid #f3e6c8;border-radius:9px;padding:11px 13px}
.vc-expl-lbl{font-size:10px;font-weight:700;color:#b45309;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.vc-expl p{font-size:12.5px;color:#4b4638;line-height:1.75}

/* Quiz */

.quiz-q{font-size:13.5px;font-weight:700;color:#1f2937;margin-bottom:11px;line-height:1.6}
.quiz-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.quiz-choice{text-align:left;padding:9px 13px;border:1.5px solid #e7e2d8;border-radius:9px;background:#fff;font-size:12.5px;color:#3a352b;cursor:pointer;transition:.12s}
.quiz-choice:hover:not(:disabled){border-color:#14b8a6;background:#f0fdfa}
.quiz-choice:disabled{cursor:default}
.quiz-choice.correct{background:#dcfce7;border-color:#16a34a;color:#15803d;font-weight:700}
.quiz-choice.wrong{background:#fee2e2;border-color:#dc2626;color:#b91c1c}
.quiz-expl{margin-top:10px;font-size:12px;color:#5c5647;background:#faf9f5;border-radius:8px;padding:10px 12px;display:none;line-height:1.7}
.quiz-expl.show{display:block}

/* Review section */
#review-section{margin-top:10px;background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #efe9dc}
#review-section h2{font-size:15px;font-weight:800;color:#1f2937;margin-bottom:5px}
#review-section .rv-sub{font-size:12px;color:#8a8371;margin-bottom:16px}
#rv-start-btn{background:#0f3d3a;color:#fff;border:none;padding:11px 22px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
#rv-start-btn:hover{background:#134e4a}
#rv-empty{font-size:12.5px;color:#a8a190}
#rv-body{margin-top:14px}

/* Footer */
#footer-actions{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid #d9d3c2;background:#fff;color:#3a352b}
.btn:hover{border-color:#14b8a6;color:#0f3d3a}
.btn.primary{background:#0f3d3a;color:#fff;border-color:#0f3d3a}
.btn.primary:hover{background:#134e4a}
#footer-note{font-size:11px;color:#a8a190;margin-top:14px;line-height:1.7}
</style>

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
const TYPE_LABEL = { word:'単語', idiom:'イディオム', phrase:'フレーズ' };
const TYPE_BADGE = { word:'b-word', idiom:'b-idiom', phrase:'b-phrase' };
const TYPE_BORDER = { word:'tp-word', idiom:'tp-idiom', phrase:'tp-phrase' };

function renderSynonyms(syns){
  if(!syns || !syns.length) return '';
  return '<div class="vc-syn"><div class="vc-syn-lbl">類義語とニュアンスの違い</div>' +
    syns.map(function(s){
      return '<div class="syn-row"><span class="syn-term">'+esc(s.term)+'</span> — <span class="syn-nuance">'+esc(s.nuance_ja)+'</span></div>';
    }).join('') + '</div>';
}

function renderExamples(exs){
  return '<div class="vc-ex">' + exs.map(function(e){ return '<p>'+esc(e)+'</p>'; }).join('') + '</div>';
}

function renderCoreCard(it){
  return '<div class="vcard '+TYPE_BORDER[it.type]+'">' +
    '<div class="vc-top"><span class="vc-badge '+TYPE_BADGE[it.type]+'">'+TYPE_LABEL[it.type]+'</span><span class="vc-reg">'+esc(it.register||'')+'</span></div>' +
    '<div class="vc-term">'+esc(it.term)+(it.ipa?'<span class="vc-ipa">'+esc(it.ipa)+'</span>':'')+'</div>' +
    '<div class="vc-mean-ja">'+esc(it.meaning_ja)+'</div>' +
    '<div class="vc-mean-en">'+esc(it.meaning_en)+'</div>' +
    renderExamples(it.examples) +
    renderSynonyms(it.synonyms) +
    '<div class="vc-expl"><div class="vc-expl-lbl">🔍 深掘り解説</div><p>'+esc(it.explanation_ja)+'</p></div>' +
    '</div>';
}

function renderAdjCard(it){
  return '<div class="vcard tp-adj">' +
    '<div class="vc-top"><span class="vc-badge b-adj">ネイティブ形容詞</span></div>' +
    '<div class="vc-term">'+esc(it.term)+(it.ipa?'<span class="vc-ipa">'+esc(it.ipa)+'</span>':'')+'</div>' +
    '<div class="vc-mean-ja">'+esc(it.meaning_ja)+'</div>' +
    '<div class="vc-mean-en">'+esc(it.meaning_en)+'</div>' +
    renderExamples(it.examples) +
    renderSynonyms(it.synonyms) +
    '<div class="vc-expl"><div class="vc-expl-lbl">🔍 深掘り解説</div><p>'+esc(it.explanation_ja)+'</p></div>' +
    '</div>';
}

function renderColloCard(it){
  return '<div class="vcard tp-collo">' +
    '<div class="vc-top"><span class="vc-badge b-collo">実務コロケーション</span></div>' +
    '<div class="vc-term">'+esc(it.phrase)+'</div>' +
    '<div class="vc-mean-ja">'+esc(it.meaning_ja)+'</div>' +
    renderExamples(it.examples) +
    '<div class="vc-expl"><div class="vc-expl-lbl">🔍 深掘り解説</div><p>'+esc(it.explanation_ja)+'</p></div>' +
    '</div>';
}

function renderQuiz(qs, prefix){
  return qs.map(function(q, i){
    const qid = prefix+'-'+i;
    return '<div class="quiz-box">' +
      '<div class="quiz-q">Q'+(i+1)+'. '+esc(q.question_ja)+'</div>' +
      '<div class="quiz-choices" id="'+qid+'-choices">' +
        q.choices.map(function(c, ci){
          return '<button class="quiz-choice" onclick="answerQuiz(\''+qid+'\', '+ci+', '+q.answerIndex+')">'+esc(c)+'</button>';
        }).join('') +
      '</div>' +
      '<div class="quiz-expl" id="'+qid+'-expl">'+esc(q.explanation_ja)+'</div>' +
      '</div>';
  }).join('');
}

function answerQuiz(qid, chosenIdx, answerIdx){
  const box = document.getElementById(qid+'-choices');
  const btns = box.querySelectorAll('.quiz-choice');
  btns.forEach(function(b, i){
    b.disabled = true;
    if(i === answerIdx) b.classList.add('correct');
    else if(i === chosenIdx) b.classList.add('wrong');
  });
  document.getElementById(qid+'-expl').classList.add('show');
}

function renderPanel(r, idx){
  const html =
    '<div class="meta-bar"><div class="meta-date">'+esc(r.dateLabel)+'</div><div class="meta-time">⏱ 目安 '+r.readTimeMin+'分</div></div>' +
    '<div class="section"><div class="sec-title">🧠 今日のコア表現（単語・イディオム・フレーズ）</div><div class="card-grid">' +
      r.coreItems.map(renderCoreCard).join('') + '</div></div>' +
    '<div class="section"><div class="sec-title">✨ 知っておきたいネイティブ形容詞</div><div class="card-grid">' +
      r.adjectives.map(renderAdjCard).join('') + '</div></div>' +
    '<div class="section"><div class="sec-title">🤝 実務でよく使うコロケーション</div><div class="card-grid">' +
      r.collocations.map(renderColloCard).join('') + '</div></div>' +
    '<div class="section"><div class="sec-title">📝 本日のクイズ</div>' +
      renderQuiz(r.todayQuiz, 'today-'+idx) + '</div>';
  return html;
}

let currentIdx = ENGLISH_REPORTS.length - 1;

function renderTabs(){
  const nav = document.getElementById('tab-nav-inner');
  nav.innerHTML = ENGLISH_REPORTS.map(function(r, i){
    const d = new Date(r.date+'T00:00:00');
    const dow = ['日','月','火','水','木','金','土'][d.getDay()];
    return '<button class="tab-btn'+(i===currentIdx?' active':'')+'" onclick="selectDay('+i+')">'+r.date.slice(5)+'<span class="dow">'+dow+'曜</span></button>';
  }).join('');
}

function selectDay(i){
  currentIdx = i;
  renderTabs();
  renderAll();
}

function renderAll(){
  const panels = document.getElementById('panels');
  const r = ENGLISH_REPORTS[currentIdx];
  panels.innerHTML = '<div class="report-panel active">' + renderPanel(r, currentIdx) + '</div>';
  const totalToday = ENGLISH_REPORTS.reduce(function(s, x){
    return s + x.coreItems.length + x.adjectives.length + x.collocations.length;
  }, 0);
  document.getElementById('stat-badge').textContent = '直近7日で ' + totalToday + ' 表現を掲載中';
}

/* ── Review quiz (spaced repetition pool) ── */
function flattenPool(reports, excludeLastOf){
  const pool = [];
  reports.forEach(function(r){
    if(r.date === excludeLastOf) return;
    r.coreItems.forEach(function(it){ pool.push({ label: it.term, meaning: it.meaning_ja }); });
    r.adjectives.forEach(function(it){ pool.push({ label: it.term, meaning: it.meaning_ja }); });
    r.collocations.forEach(function(it){ pool.push({ label: it.phrase, meaning: it.meaning_ja }); });
  });
  return pool;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

async function fetchArchiveReports(){
  try{
    const res = await fetch('archive.html', {cache:'no-store'});
    if(!res.ok) return [];
    const text = await res.text();
    const m = text.match(/const ENGLISH_REPORTS = (\[[\s\S]*?\]);\s*\/\/\s*── END_DATA/);
    if(!m) return [];
    return new Function('return ' + m[1])();
  }catch(e){
    return [];
  }
}

async function startReview(){
  document.getElementById('rv-pre').style.display = 'none';
  const body = document.getElementById('rv-body');
  body.innerHTML = '<div id="rv-empty">読み込み中...</div>';

  const archiveReports = await fetchArchiveReports();
  const latestDate = ENGLISH_REPORTS[ENGLISH_REPORTS.length-1].date;
  const allReports = archiveReports.concat(ENGLISH_REPORTS);
  const pool = flattenPool(allReports, latestDate);

  if(pool.length < 4){
    body.innerHTML = '<div id="rv-empty">復習コンテンツはまだ十分にありません。学習日数が増えると、ここに過去の表現の復習クイズが表示されます。</div>';
    return;
  }

  const picks = shuffle(pool).slice(0, Math.min(8, pool.length));
  const questions = picks.map(function(item){
    const distractors = shuffle(pool.filter(function(p){ return p.meaning !== item.meaning; })).slice(0,3).map(function(p){ return p.meaning; });
    const choices = shuffle([item.meaning].concat(distractors));
    const answerIndex = choices.indexOf(item.meaning);
    return { question_ja: '「'+item.label+'」の意味として最も適切なものを選びなさい。', choices: choices, answerIndex: answerIndex, explanation_ja: '正解：'+item.meaning };
  });

  body.innerHTML = renderQuiz(questions, 'review');
}

/* ── CSV export ── */
function csvField(s){
  const v = (s===undefined||s===null) ? '' : String(s);
  return '"' + v.replace(/"/g,'""') + '"';
}

function entryToRows(r){
  const rows = [];
  r.coreItems.forEach(function(it){
    rows.push([r.date, TYPE_LABEL[it.type]||it.type, it.term, it.meaning_ja, it.meaning_en,
      it.examples.join(' / '),
      (it.synonyms||[]).map(function(s){ return s.term+':'+s.nuance_ja; }).join(' ; '),
      it.explanation_ja]);
  });
  r.adjectives.forEach(function(it){
    rows.push([r.date, '形容詞', it.term, it.meaning_ja, it.meaning_en,
      it.examples.join(' / '),
      (it.synonyms||[]).map(function(s){ return s.term+':'+s.nuance_ja; }).join(' ; '),
      it.explanation_ja]);
  });
  r.collocations.forEach(function(it){
    rows.push([r.date, 'コロケーション', it.phrase, it.meaning_ja, '',
      it.examples.join(' / '), '', it.explanation_ja]);
  });
  return rows;
}

async function exportCsv(){
  const archiveReports = await fetchArchiveReports();
  const allReports = archiveReports.concat(ENGLISH_REPORTS);
  const header = ['date','category','term','meaning_ja','meaning_en','examples','synonyms','explanation_ja'];
  let rows = [header];
  allReports.forEach(function(r){ rows = rows.concat(entryToRows(r)); });
  const csv = rows.map(function(row){ return row.map(csvField).join(','); }).join('\r\n');
  const blob = new Blob(["﻿"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'english_daily_vocab.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

renderTabs();
renderAll();
